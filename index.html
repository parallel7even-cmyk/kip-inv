<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#20262d;background:#f6f7f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:230px;background:white;border-right:1px solid #e6e9ed;padding:25px 15px;display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:.05em;font-size:13px;padding:0 10px 30px}.brand small{display:block;font-weight:500;color:#8a929c;letter-spacing:0;margin-top:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:8px;color:#69727d;font-size:13px}.nav button.active,.nav button:hover{background:#edf4f1;color:#285446}.sidefoot{margin-top:auto;color:#8a929c;font-size:11px;padding:10px}.main{margin-left:230px}.top{height:65px;background:white;border-bottom:1px solid #e6e9ed;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:12px;color:#7d8792}.content{max-width:1300px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:750;color:#87909a;text-transform:uppercase}.heading h1{font-size:30px;letter-spacing:-1px;margin:8px 0}.heading p{font-size:13px;color:#78818b;margin:0}.btn{border:1px solid #dce1e6;background:white;color:#303943;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:650}.btn.primary{background:#285446;border-color:#285446;color:white}.btn.danger{color:#b84a43}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:white;border:1px solid #e4e8ec;border-radius:10px;padding:19px}.statlabel{font-size:12px;color:#77818b}.statval{font-size:25px;font-weight:750;letter-spacing:-.7px;margin:15px 0 6px}.muted{color:#89919a;font-size:11px}.panel{background:white;border:1px solid # border:1px solid #dce1e6;border-radius:6px;padding:9px;font-size:12px}.totalbox{margin:18px 0 0 auto;max-width:300px;display:grid;grid-template-columns:1fr auto;gap:9px;font-size:12px}.totalbox strong{border-top:1px solid #dce1e6;padding-top:12px;font-size:15px}.modalactions{display:flex;justify-content:flex-end;gap:8px;padding:18px 22px;background:white;border-top:1px solid #e5e9ed}.empty{padding:42px;text-align:center;color:#858e97;font-size:13px}.hide{display:none!important}.settingsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.settingsgrid .card h3{font-size:14px;margin-top:0}.note{font-size:12px;line-height:1.6;color:#737d87}.companyrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid #edf0f2;padding:13px 0;font-size:12px}.companyrow:last-child{border:0}.companyrow select{margin-left:auto;max-width:170px}.invoiceprint{display:none}

<div class="shell"><aside class="side"><div class="brand">KKP INVOICE STUDIO<small>Finance workspace</small></div><nav class="nav">

<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID();
const companies=[{name:'Kiteskraft Productions LLP',family:'kkp',gst:'03AAVFK7727M1ZM',address:'SCF 126 Urban Estate Phase 1, Chandigarh Road, Jamalpur, Ludhiana, Punjab 141010',email:'info@kiteskraft.com',phone:'+91 88729 80300',website:'www.kiteskraft.com',logo:'KKP'},{name:'Kites Productions',family:'kkp',gst:'03AAVFK7727M1ZM',address:'SCF 126 Urban Estate Phase 1, Chandigarh Road, Jamalpur, Ludhiana, Punjab 141010',email:'info@kiteskraft.com',phone:'+91 88729 80300',website:'www.kiteskraft.com',logo:'KP'},{name:'Kiteskraft Productions',family:'kkp',gst:'03AAVFK7727M1ZM',address:'SCF 126 Urban Estate Phase 1, Chandigarh Road, Jamalpur, Ludhiana, Punjab 141010',email:'info@kiteskraft.com',phone:'+91 88729 80300',website:'www.kiteskraft.com',logo:'KKP'},{name:'Notch Productions',family:'kkp',gst:'03AAVFK7727M1ZM',address:'SCF 126 Urban Estate Phase 1, Chandigarh Road, Jamalpur, Ludhiana, Punjab 141010',email:'info@kiteskraft.com',phone:'+91 88729 80300',website:'www.kiteskraft.com',logo:'KI'},{name:'Kites International',family:'kkp',gst:'03AAVFK7727M1ZM',address:'SCF 126 Urban Estate Phase 1, Chandigarh Road, Jamalpur, Ludhiana, Punjab 141010',email:'info@kiteskraft.com',phone:'+91 88729 80300',website:'www.kiteskraft.com',logo:'KI'},{name:'ACS-Adreneur Consultancy Solutions Pvt. Ltd.',family:'acs',gst:'03ABDCA0648K1ZW',address:'D-266d Phase 8B Industrial Focal Point, Sec 74, Balongi, S.A.S. Nagar (Mohali), Punjab',email:'adreneur@gmail.com',phone:'+91 99157-27207',website:'www.adreneur.com',logo:'ACS'}];
const SUPABASE_URL='https://zvigtdsjctvofclobdxp.supabase.co';const SUPABASE_KEY='sb_publishable_aTPuH838rrhUYsseOgmSQQ_VLJ-nFor';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null;let data={invoices:[],clients:[],banks:[],settings:{logoByCompany:{}}},page='Dashboard',editing=null;
const save=()=>{localStorage.setItem('kkp-invoice-studio-v1',JSON.stringify(data));if(currentUser)syncDatabase().catch(e=>{console.error(e);statusMessage('Database save failed: '+e.message,true)})}, totals=inv=>{let sub=(inv.items||[]).reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0),discount=+inv.discount||0,taxable=Math.max(0,sub-discount),tax=inv.gstMode==='none'?0:taxable*(+inv.gstRate||0)/100;return{sub,discount,taxable,tax,cgst:inv.gstMode==='cgst_sgst'?tax/2:0,sgst:inv.gstMode==='cgst_sgst'?tax/2:0,igst:inv.gstMode==='igst'?tax:0,total:taxable+tax}};
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent='Workspace / '+p;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){const c=$('#content');if(page==='Dashboard'){let total=data.invoices.reduce((s,i)=>s+totals(i).total,0),paid=data.invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+totals(i).total,0),pending=data.invoices.filter(i=>!['paid','cancelled'].includes(i.status)).reduce((s,i)=>s+totals(i).total,0);c.innerHTML=`<div class="heading"><div><div class="eyebrow">Overview</div><h1>Dashboard</h1><p>Your invoicing activity at a glance.</p></div><button class="btn primary" onclick="openInvoice()">＋ Create invoice</button></div><div class="stats"><div class="card"><div class="statlabel">Total invoiced</div><div class="statval">${money(total)}</div><div class="muted">${data.invoices.length} invoices recorded</div></div><div class="card"><div class="statlabel">Paid</div><div class="statval">${money(paid)}</div><div class="muted">Marked as paid</div></div><div class="card"><div class="statlabel">Outstanding</div><div class="statval">${money(pending)}</div><div class="muted">Draft, sent and overdue</div></div><div class="card"><div class="statlabel">Clients</div><div class="statval">${data.clients.length}</div><div class="muted">Saved client records</div></div></div><section class="panel"><div class="panelhead"><h2>Recent invoices</h2><button class="btn" onclick="go('Invoices')">View all invoices →</button></div>${invoiceTable(data.invoices.slice().reverse().slice(0,6))}</section><div class="note">Prototype storage: records are saved in this browser only. They are not yet synced across team members or devices.</div>`}
else if(page==='Invoices'){c.innerHTML=`<div class="heading"><div><div class="eyebrow">Billing</div><h1>Invoices</h1><p>Create, track and print your invoices.</p></div><button class="btn primary" onclick="openInvoice()">＋ Create invoice</button></div><div class="panel"><div class="panelhead"><h2>All invoices</h2><div class="tools"><input id="searchinv" placeholder="Search invoice or client…" oninput="filterInvoices(this.value)"><select id="filterstatus" onchange="filterInvoices($('#searchinv').value)" class="btn"><option value="">All statuses</option><option>draft</option><option>sent</option><option>paid</option><option>overdue</option><option>cancelled</option></select></div></div><div id="invtable">${invoiceTable(data.invoices.slice().reverse())}</div></div>`}
else if(page==='Clients'){c.innerHTML=`<div class="heading"><div><div class="eyebrow">Directory</div><h1>Clients</h1><p>Keep client billing information ready for invoices.</p></div><button class="btn primary" onclick="openClient()">＋ Add client</button></div><div class="panel"><div class="panelhead"><h2>Client directory</h2></div>${data.clients.length?'<div class="tablewrap"><table><thead><tr><th>Client</th><th>Email</th><th>GSTIN</th><th>Address</th><th></th></tr></thead><tbody>'+data.clients.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.company||'')}</div></td><td>${esc(x.email||'—')}</td><td>${esc(x.gst||'—')}</td><td>${esc(x.address||'—')}</td><td><button class="btn danger" onclick="delClient('${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">No clients yet. Add a client to start creating invoices.</div>'}</div>`}
else if(page==='Companies'){c.innerHTML=`<div class="heading"><div><div class="eyebrow">Brand identity</div><h1>Companies & logos</h1><p>Select the logo used for each issuing entity.</p></div></div><div class="panel"><div class="panelhead"><h2>Company profiles</h2></div><div style="padding:4px 22px">${companies.map((x,i)=>`<div class="companyrow"><div style="width:36px;height:36px;display:grid;place-items:center;background:#f0f4f2;border-radius:7px;font-weight:800;color:#285446">${x.logo}</div><div><b>${esc(x.name)}</b><div class="muted">GSTIN: ${x.gst}</div></div><select class="btn" onchange="setLogo(${i},this.value)"><option ${(data.settings.logoByCompany[x.name]||x.logo)==='KKP'?'selected':''}>KKP</option><option ${(data.settings.logoByCompany[x.name]||x.logo)==='KP'?'selected':''}>KP</option><option ${(data.settings.logoByCompany[x.name]||x.logo)==='KI'?'selected':''}>KI</option><option ${(data.settings.logoByCompany[x.name]||x.logo)==='ACS'?'selected':''}>ACS</option><option ${(data.settings.logoByCompany[x.name]||x.logo)==='Asset 1'?'selected':''}>Asset 1</option></select></div>`).join('')}</div></div><div class="note">Logo names are selectable placeholders in this starter build. Upload the original logo assets to the repository to display the actual artwork.</div>`}
else if(page==='Settings'){c.innerHTML=`<div class="heading"><div><div class="eyebrow">Workspace</div><h1>Settings</h1><p>Manage bank details and local workspace data.</p></div></div><div class="settingsgrid"><div class="card"><h3>Bank accounts</h3><p class="note">Add bank details to choose on each invoice. Check account and IFSC details before issuing.</p><div id="banks">${data.banks.length?data.banks.map(b=>`<div class="companyrow"><div><b>${esc(b.label)}</b><div class="muted">${esc(b.bank)} · A/C ending ${esc(b.account.slice(-4))}</div></div><button class="btn danger" onclick="delBank('${b.id}')">Delete</button></div>`).join(''):'<p class="muted">No bank accounts saved.</p>'}</div><form onsubmit="addBank(event)" class="formgrid"><div class="field"><label>Account label</label><input name="label" required placeholder="e.g. KKP Current Account"></div><div class="field"><label>Bank name</label><input name="bank" required placeholder="Bank name"></div><div class="field"><label>Account holder</label><input name="holder" required></div><div class="field"><label>Account number</label><input name="account" required></div><div class="field full"><label>IFSC</label><input name="ifsc" required></div><div class="full"><button class="btn primary">Add bank account</button></div></form></div><div class="card"><h3>Workspace data</h3><p class="note">This starter app stores invoices, clients and settings in the current browser's local storage. Clearing browser data will remove this local copy. Shared login, database sync and team access are not connected yet.</p><button class="btn" onclick="exportData()">Export backup JSON</button> <label class="btn">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label><hr style="border:0;border-top:1px solid #e7eaed;margin:22px 0"><button class="btn danger" onclick="if(confirm('Delete all locally saved invoices, clients and settings? Export a backup first if needed.')){data={invoices:[],clients:[],banks:[],settings:{logoByCompany:{}}};save();render()}">Clear local data</button></div></div>`}
}
function invoiceTable(list){if(!list.length)return '<div class="empty">No invoices yet. Create your first invoice.</div>';return '<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Client</th><th>Issue date</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+list.map(i=>{let cl=data.clients.find(c=>c.id===i.clientId)||{},t=totals(i);return `<tr><td><b>${esc(i.number)}</b><div class="muted">Due ${esc(i.due||'on receipt')}</div></td><td>${esc(cl.company||cl.name||i.clientName||'—')}</td><td>${esc(i.date)}</td><td><b>${money(t.total)}</b></td><td><span class="pill ${i.status}">${esc(i.status)}</span></td><td><button class="btn" onclick="printInvoice('${i.id}')">PDF / Print</button> <button class="btn" onclick="openInvoice('${i.id}')">Edit</button> <button class="btn danger" onclick="deleteInvoice('${i.id}')">Delete</button></td></tr>`}).join('')+'</tbody></table></div>'}
function filterInvoices(q){let s=$('#filterstatus')?.value||'',a=data.invoices.slice().reverse().filter(i=>(!s||i.status===s)&&((i.number+' '+(data.clients.find(c=>c.id===i.clientId)?.name||i.clientName||'')).toLowerCase().includes(q.toLowerCase())));$('#invtable').innerHTML=invoiceTable(a)}
function openClient(){ $('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveClient(event)"><div class="modalhead"><h2>Add client</h2><button type="button" class="btn" onclick="closeModal()">Close</button></div><div class="modalbody formgrid"><div class="field"><label>Contact name *</label><input name="name" required></div><div class="field"><label>Company name</label><input name="company"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>GSTIN</label><input name="gst"></div><div class="field full"><label>Billing address</label><textarea name="address" rows="3"></textarea></div></div><div class="modalactions"><button class="btn primary">Save client</button></div></form></div>`}
function saveClient(e){e.preventDefault();let f=new FormData(e.target);data.clients.push({id:uid(),name:f.get('name'),company:f.get('company'),email:f.get('email'),phone:f.get('phone'),gst:f.get('gst'),address:f.get('address')});save();closeModal();render()}
function openInvoice(id){editing=id||null;let old=data.invoices.find(i=>i.id===id);let d=old?JSON.parse(JSON.stringify(old)):{id:uid(),number:'KKP/'+new Date().getFullYear()+'/'+String(data.invoices.length+1).padStart(3,'0'),date:today(),due:'',company:companies[0].name,clientId:'',clientName:'',status:'draft',gstMode:'cgst_sgst',gstRate:18,discount:0,notes:'',terms:'Payment due as per agreed terms.',items:[{description:'Professional services',qty:1,rate:0}]};window.draft=d;
$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveInvoice(event)"><div class="modalhead"><div><h2>${id?'Edit invoice':'Create invoice'}</h2><div class="muted">Invoice details · line items · GST</div></div><button type="button" class="btn" onclick="closeModal()">Close</button></div><div class="modalbody"><div class="formgrid"><div class="field"><label>Issuing company</label><select name="company" onchange="refreshCompany(this.value)"><option>${esc(d.company)}</option>${companies.filter(c=>c.name!==d.company).map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Invoice number *</label><input name="number" required value="${esc(d.number)}"></div><div class="field"><label>Client *</label><select name="clientId" required><option value="">Select client</option>${data.clients.map(c=>`<option value="${c.id}" ${d.clientId===c.id?'selected':''}>${esc(c.company||c.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['draft','sent','paid','overdue','cancelled'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Issue date</label><input type="date" name="date" required value="${d.date}"></div><div class="field"><label>Due date</label><input type="date" name="due" value="${d.due}"></div><div class="field"><label>GST treatment</label><select name="gstMode"><option value="cgst_sgst" ${d.gstMode==='cgst_sgst'?'selected':''}>CGST + SGST</option><option value="igst" ${d.gstMode==='igst'?'selected':''}>IGST</option><option value="none" ${d.gstMode==='none'?'selected':''}>No GST</option></select></div><div class="field"><label>GST rate</label><select name="gstRate">${[0,5,12,18,28].map(n=>`<option value="${n}" ${+d.gstRate===n?'selected':''}>${n}%</option>`).join('')}</select></div><div class="field"><label>Discount (₹)</label><input name="discount" type="number" min="0" step=".01" value="${d.discount}"></div><div class="field"><label>Logo selection</label><select name="logo">${['KKP','KP','KI','ACS','Asset 1'].map(x=>`<option ${(data.settings.logoByCompany[d.company]||companies.find(c=>c.name===d.company)?.logo)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><input name="notes" value="${esc(d.notes||'')}"></div><div class="field full"><label>Terms</label><textarea name="terms" rows="2">${esc(d.terms||'')}</textarea></div></div><div class="linehead"><h3>Line items</h3><button type="button" class="btn" onclick="addItem()">＋ Add line</button></div><div id="items">${d.items.map((it,i)=>itemRow(it,i)).join('')}</div><div class="totalbox" id="liveTotals"></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn" onclick="saveInvoice(event,true)">Save & PDF</button><button class="btn primary">Save invoice</button></div></form></div>`;updateTotals()}
function itemRow(it,i){return `<div class="itemrow"><input placeholder="Description" data-k="description" value="${esc(it.description)}" oninput="updateTotals()"><input type="number" min="0" step=".001" data-k="qty" value="${it.qty}" oninput="updateTotals()"><input type="number" min="0" step=".01" data-k="rate" value="${it.rate}" oninput="updateTotals()"><input class="amount" disabled value="${money((+it.qty||0)*(+it.rate||0))}"><button type="button" class="btn danger" onclick="this.parentElement.remove();updateTotals()">×</button></div>`}
function addItem(){let root=$('#items');root.insertAdjacentHTML('beforeend',itemRow({description:'',qty:1,rate:0},root.children.length));updateTotals()}
function updateTotals(){if(!$('#items'))return;let items=[...$('#items').children].map(r=>({qty:r.querySelector('[data-k=qty]').value,rate:r.querySelector('[data-k=rate]').value})),sub=items.reduce((s,i)=>s+(+i.qty||0)*(+i.rate||0),0),discount=+($('[name=discount]')?.value||0),taxable=Math.max(0,sub-discount),mode=$('[name=gstMode]')?.value||'cgst_sgst',tax=mode==='none'?0:taxable*(+($('[name=gstRate]')?.value||0))/100;[...$('#items').children].forEach((r,i)=>r.querySelector('.amount').value=money((+items[i].qty||0)*(+items[i].rate||0)));$('#liveTotals').innerHTML=`<span>Subtotal</span><span>${money(sub)}</span><span>Discount</span><span>−${money(discount)}</span><span>GST</span><span>${money(tax)}</span><strong>Total due</strong><strong>${money(taxable+tax)}</strong>`}
function saveInvoice(e,printAfter=false){e.preventDefault();let form=e.target.closest('form')||$('#modalroot form'),f=new FormData(form),client=data.clients.find(c=>c.id===f.get('clientId'));let inv={...window.draft,number:f.get('number'),date:f.get('date'),due:f.get('due'),company:f.get('company'),clientId:f.get('clientId'),clientName:client?.company||client?.name||'',status:f.get('status'),gstMode:f.get('gstMode'),gstRate:+f.get('gstRate'),discount:+f.get('discount')||0,notes:f.get('notes'),terms:f.get('terms'),logo:f.get('logo'),items:[...$('#items').children].map(r=>({description:r.querySelector('[data-k=description]').value,qty:+r.querySelector('[data-k=qty]').value||0,rate:+r.querySelector('[data-k=rate]').value||0}))};if(!inv.items.length){alert('Add at least one line item.');return}let ix=data.invoices.findIndex(x=>x.id===inv.id);if(ix>=0)data.invoices[ix]=inv;else data.invoices.push(inv);save();closeModal();render();if(printAfter)printInvoice(inv.id)}
function printInvoice(id){let i=data.invoices.find(x=>x.id===id);if(!i)return;let c=companies.find(x=>x.name===i.company)||companies[0],client=data.clients.find(x=>x.id===i.clientId)||{name:i.clientName||'Client'},t=totals(i),bank=data.banks[0];$('#printarea').innerHTML=`<div class="printtop"><div><div style="font-weight:800;letter-spacing:2px;color:#285446;font-size:16px">${esc(i.logo||c.logo)}</div><h2>${esc(c.name)}</h2><div>${esc(c.address)}</div><div>GSTIN: ${esc(c.gst)}</div><div>${esc(c.email)} · ${esc(c.phone)} · ${esc(c.website)}</div></div><div style="text-align:right"><h1>INVOICE</h1><b>${esc(i.number)}</b><div>Issue date: ${esc(i.date)}</div><div>Due date: ${esc(i.due||'On receipt')}</div><div style="margin-top:10px;text-transform:uppercase">${esc(i.status)}</div></div></div><div class="printmeta"><div><b>BILL TO</b><h3>${esc(client.company||client.name)}</h3><div>${esc(client.address||'')}</div><div>${esc(client.email||'')}</div><div>GSTIN: ${esc(client.gst||'—')}</div></div><div><b>PAYMENT DETAILS</b><div>${bank?esc(bank.bank)+' · '+esc(bank.holder)+'<br>Account: '+esc(bank.account)+'<br>IFSC: '+esc(bank.ifsc):'Bank details to be confirmed'}</div></div></div><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.description)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.qty*x.rate)}</td></tr>`).join('')}</tbody></table><div class="printtotals"><span>Subtotal</span><span>${money(t.sub)}</span><span>Discount</span><span>−${money(t.discount)}</span>${i.gstMode==='cgst_sgst'?'<span>CGST</span><span>'+money(t.cgst)+'</span><span>SGST</span><span>'+money(t.sgst)+'</span>':i.gstMode==='igst'?'<span>IGST</span><span>'+money(t.igst)+'</span>':''}<strong>Total due</strong><strong>${money(t.total)}</strong></div><p>${esc(i.notes||'')}</p><p><b>Terms & conditions</b><br>${esc(i.terms||'')}</p><div class="printfoot">This invoice was generated by KKP Invoice Studio. Please verify company, tax and bank details before issuing.</div>`;window.print()}
function closeModal(){$('#modalroot').innerHTML=''}
async function deleteInvoice(id){if(confirm('Delete this invoice?')){data.invoices=data.invoices.filter(i=>i.id!==id);if(currentUser){const r=await sb.from('kkp_invoices').delete().eq('id',id);if(r.error){alert(r.error.message);return}}save();render()}}
async function delClient(id){if(confirm('Delete this client?')){if(currentUser){const r=await sb.from('kkp_invoice_clients').delete().eq('id',id);if(r.error){alert('Could not delete client. '+r.error.message);return}}data.clients=data.clients.filter(i=>i.id!==id);save();render()}}
function setLogo(i,v){data.settings.logoByCompany[companies[i].name]=v;save()}
function addBank(e){e.preventDefault();let f=new FormData(e.target);data.banks.push({id:uid(),label:f.get('label'),bank:f.get('bank'),holder:f.get('holder'),account:f.get('account'),ifsc:f.get('ifsc')});save();render()}
function delBank(id){data.banks=data.banks.filter(b=>b.id!==id);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kkp-invoice-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.invoices)||!Array.isArray(d.clients))throw Error();data=d;save();render();alert('Backup imported.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
function refreshCompany(v){window.draft.company=v}
render();
function statusMessage(msg,bad){var el=$('#connection');if(el){el.textContent=msg;el.style.color=bad?'#b84a43':'#287a53'}}
function showAuth(){document.querySelector('.shell').style.display='none';$('#authroot').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f7f8"><form id="authform" style="width:min(420px,100%);padding:30px;background:white;border:1px solid #e2e7eb;border-radius:12px"><div class="eyebrow">KKP INVOICE STUDIO</div><h1>Sign in to your workspace</h1><p class="note">Use your Supabase account. New users can create an account with email and password.</p><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" onclick="authAction(\'signup\')">Create account</button></div><div id="authmsg" class="note"></div></form></div>';$('#authform').onsubmit=function(e){e.preventDefault();authAction('signin')}}
async function authAction(mode){var form=$('#authform'),email=form.email.value.trim(),password=form.password.value;$('#authmsg').textContent='Connecting…';var result=mode==='signup'?await sb.auth.signUp({email:email,password:password}):await sb.auth.signInWithPassword({email:email,password:password});if(result.error){$('#authmsg').textContent=result.error.message;return}if(mode==='signup'&&!result.data.session){$('#authmsg').textContent='Account created. Confirm your email, then sign in.';return}if(result.data.session){currentUser=result.data.user;await startWorkspace()}}
async function loadDatabase(){var pair=await Promise.all([sb.from('kkp_invoice_clients').select('*').order('created_at',{ascending:false}),sb.from('kkp_invoices').select('*,kkp_invoice_items(*)').order('created_at',{ascending:false})]);if(pair[0].error)throw pair[0].error;if(pair[1].error)throw pair[1].error;data.clients=pair[0].data.map(function(c){return{id:c.id,name:c.name,company:c.company_name,email:c.email,phone:c.phone,gst:c.gstin,address:c.billing_address}});data.invoices=pair[1].data.map(function(i){var cl=data.clients.find(function(c){return c.id===i.client_id});return{id:i.id,number:i.invoice_number,date:i.issue_date,due:i.due_date||'',company:i.company_name,clientId:i.client_id,clientName:cl?(cl.company||cl.name):'',status:i.status,gstMode:i.gst_mode,gstRate:Number(i.gst_rate),discount:Number(i.discount_amount),notes:i.notes,terms:i.terms,logo:i.template_type==='acs'?'ACS':(data.settings.logoByCompany[i.company_name]||(companies.find(function(c){return c.name===i.company_name})||{}).logo||'KKP'),items:(i.kkp_invoice_items||[]).sort(function(a,b){return a.sort_order-b.sort_order}).map(function(x){return{description:x.description,qty:Number(x.quantity),rate:Number(x.unit_price)}})}});localStorage.setItem('kkp-invoice-studio-v1',JSON.stringify(data))}
async function syncDatabase(){if(!currentUser)return;for(var c of data.clients){var cr=await sb.from('kkp_invoice_clients').upsert({id:c.id,created_by:currentUser.id,name:c.name,company_name:c.company||'',email:c.email||'',phone:c.phone||'',gstin:c.gst||'',billing_address:c.address||''});if(cr.error)throw cr.error}for(var i of data.invoices){var t=totals(i),cl=data.clients.find(function(c){return c.id===i.clientId});var ir=await sb.from('kkp_invoices').upsert({id:i.id,created_by:currentUser.id,client_id:cl?cl.id:null,invoice_number:i.number,status:i.status,issue_date:i.date,due_date:i.due||null,currency:'INR',gst_mode:i.gstMode,gst_rate:+i.gstRate||0,subtotal:t.sub,discount_amount:t.discount,taxable_amount:t.taxable,cgst_amount:t.cgst,sgst_amount:t.sgst,igst_amount:t.igst,tax_amount:t.tax,total:t.total,notes:i.notes||'',terms:i.terms||'',company_name:i.company,template_type:((companies.find(function(c){return c.name===i.company})||{}).family==='acs')?'acs':'kkp'});if(ir.error)throw ir.error;var dr=await sb.from('kkp_invoice_items').delete().eq('invoice_id',i.id);if(dr.error)throw dr.error;var rows=(i.items||[]).map(function(x,n){return{invoice_id:i.id,created_by:currentUser.id,description:x.description||'Item',quantity:+x.qty||1,unit_price:+x.rate||0,gst_rate:+i.gstRate||0,amount:(+x.qty||0)*(+x.rate||0),sort_order:n}});if(rows.length){var xr=await sb.from('kkp_invoice_items').insert(rows);if(xr.error)throw xr.error}}statusMessage('Supabase · Online',false)}
async function startWorkspace(){try{await loadDatabase();$('#authroot').innerHTML='';document.querySelector('.shell').style.display='';$('#signout').style.display='';statusMessage('Supabase · Online',false);render()}catch(e){statusMessage('Database error: '+e.message,true);alert('Could not load Supabase data: '+e.message)}}
async function signOut(){await sb.auth.signOut();currentUser=null;showAuth()}
sb.auth.getSession().then(async function(x){if(x.data.session){currentUser=x.data.session.user;await startWorkspace()}else showAuth()});
</script></body></html>
