let selectedLogo='KKP',items=[{desc:'Article Publication in Forbes',qty:1,rate:45000,gst:5}];
const $=id=>document.getElementById(id); const money=n=>'₹ '+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function initLogos(){ $('logoSelect').value=selectedLogo; $('logoSelect').addEventListener('change',()=>{selectedLogo=$('logoSelect').value;render()}); }
function addItem(){items.push({desc:'New item',qty:1,rate:0,gst:5});renderItems()}
function renderItems(){ $('itemRows').innerHTML=items.map((it,i)=>`<tr><td>${i+1}</td><td><input aria-label="Item description" data-i="${i}" data-k="desc" value="${esc(it.desc)}"></td><td><input class="num" type="number" min="0" data-i="${i}" data-k="qty" value="${it.qty}"></td><td><input class="rate" type="number" min="0" step="0.01" data-i="${i}" data-k="rate" value="${it.rate}"></td><td><select class="gst" data-i="${i}" data-k="gst">${[0,5,12,18,28].map(n=>`<option value="${n}" ${Number(it.gst)===n?'selected':''}>${n}%</option>`).join('')}</select></td><td><button class="remove" data-remove="${i}" title="Remove item">×</button></td></tr>`).join('');document.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>{let i=+el.dataset.i,k=el.dataset.k;items[i][k]=k==='desc'?el.value:Number(el.value);renderPreview()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(items.length>1){items.splice(+b.dataset.remove,1);renderItems()}});renderPreview()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function numWords(n){n=Math.round(n);if(n===0)return 'Zero';const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function under(x){if(x<20)return ones[x];if(x<100)return tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');if(x<1000)return ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+under(x%100):'');return ''}let out='';const scales=[[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand'],[1,'']];for(const [v,label] of scales){let q=Math.floor(n/v);if(q){out+=(out?' ':'')+under(q)+(label?' '+label:'');n%=v}}return out.trim()}
function render(){ $('logoSelect').value=selectedLogo; $('previewLogo').src=LOGOS[selectedLogo];$('previewLogo').alt=logoLabels[selectedLogo];renderPreview()}
function renderPreview(){const company=$('company').value;const d=companyDefaults[company]||companyDefaults['Kiteskraft Productions LLP'];$('previewCompany').textContent=company.toUpperCase();$('previewType').textContent=$('invoiceType').value.toUpperCase();$('pInvoiceNo').previousElementSibling.textContent=$('invoiceType').value==='Receipt'?'Receipt No.':'Invoice No.';$('pDate').previousElementSibling.textContent=$('invoiceType').value==='Receipt'?'Receipt Date':'Invoice Date';$('pClient').textContent=$('client').value||'—';$('pAddress').textContent=$('address').value||'';$('pClientGstin').textContent=$('clientGstin').value?'GSTIN: '+$('clientGstin').value:'';$('pInvoiceNo').textContent=$('invoiceNo').value||'—';$('pDate').textContent=$('date').value?new Date($('date').value+'T12:00:00').toLocaleDateString('en-IN'):'—';$('pPlace').textContent=$('place').value||'—';$('pSellerGstin').textContent=$('sellerGstin').value||'—';let subtotal=0,gstTotal=0;$('previewItems').innerHTML=items.map((it,i)=>{let amount=(Number(it.qty)||0)*(Number(it.rate)||0),tax=amount*(Number(it.gst)||0)/100;subtotal+=amount;gstTotal+=tax;return `<tr><td>${i+1}</td><td>${esc(it.desc)}</td><td class="center">${it.qty}</td><td class="right">${Number(it.rate||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td class="center">${it.gst}%</td><td class="right">${(amount).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr>`}).join('');let total=subtotal+gstTotal;$('subtotal').textContent=money(subtotal);$('gstTotal').textContent=money(gstTotal);$('gstLabel').textContent='GST';$('grandTotal').textContent=money(total);$('amountWords').textContent='Rupees '+numWords(total)+' Only.';$('pAccountName').textContent=$('accountName').value||'—';$('pBankName').textContent=$('bankName').value||'—';$('pAccountNo').textContent=$('accountNo').value||'—';$('pIfsc').textContent=$('ifsc').value||'—';$('pAccountType').textContent=$('accountType').value||'—';$('pNotes').textContent=$('notes').value||'For queries, contact the issuing company.';$('pContact').textContent=d.email||'Contact details to be added';$('pWebsite').textContent=d.web||'';$('pSellerAddress').textContent=d.address||'Company address to be added';document.documentElement.style.setProperty('--accent',selectedLogo==='ACS'?'#d9a21b':'#2f5f93')}
$('company').addEventListener('change',()=>{let d=companyDefaults[$('company').value];$('sellerGstin').value=d.gst; $('accountName').value=d.account;$('bankName').value=d.bank;$('accountNo').value=d.no;$('ifsc').value=d.ifsc;$('accountType').value=d.type;renderPreview()});$('bankPreset').addEventListener('change',()=>{let k=$('bankPreset').value,d=k==='acs'?companyDefaults['ACS-Adreneur Consultancy Solutions']:k==='kkp'?companyDefaults['Kiteskraft Productions LLP']:null;if(d){$('accountName').value=d.account;$('bankName').value=d.bank;$('accountNo').value=d.no;$('ifsc').value=d.ifsc;$('accountType').value=d.type;renderPreview()}});document.querySelectorAll('input:not([data-i]),textarea,select').forEach(el=>{if(!['company','bankPreset'].includes(el.id))el.addEventListener('input',renderPreview)});initLogos();renderItems();render();

const authForm=document.getElementById('authform');
async function authRun(mode){const f=authForm,email=f.email.value.trim(),password=f.password.value,msg=document.getElementById('authmsg');msg.textContent=mode==='signup'?'Creating account…':'Signing in…';const r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;return}if(mode==='signup'&&!r.data.session){msg.textContent='Account created. Check your email to confirm, then sign in.';return}currentUser=r.data.user||r.data.session?.user;await enterApp()}
authForm.addEventListener('submit',e=>{e.preventDefault();authRun('signin')});document.getElementById('signupbtn').addEventListener('click',()=>authRun('signup'));
let currentView='invoice';
async function showDashboard(){currentView='dashboard';document.getElementById('dashboard').style.display='block';document.querySelector('.layout').style.display='none';await loadDashboard()}
function showInvoice(){currentView='invoice';document.getElementById('dashboard').style.display='none';document.querySelector('.layout').style.display='grid'}
async function loadDashboard(){const recent=document.getElementById('dashRecent');recent.textContent='Loading workspace data…';try{const [ir,cr]=await Promise.all([sb.from('kkp_invoices').select('invoice_number,total,status,company_name,issue_date,created_at').order('created_at',{ascending:false}).limit(100),sb.from('kkp_invoice_clients').select('id',{count:'exact',head:true})]);if(ir.error)throw ir.error;if(cr.error)throw cr.error;const rows=ir.data||[],total=rows.reduce((n,r)=>n+Number(r.total||0),0),paid=rows.filter(r=>String(r.status).toLowerCase()==='paid').length;document.getElementById('dashInvoices').textContent=rows.length;document.getElementById('dashTotal').textContent=money(total);document.getElementById('dashPaid').textContent=paid;document.getElementById('dashClients').textContent=cr.count??'—';recent.innerHTML=rows.length?'<table class="dash-table"><thead><tr><th>Invoice</th><th>Company</th><th>Date</th><th>Status</th><th>Total</th></tr></thead><tbody>'+rows.slice(0,8).map(r=>'<tr><td>'+esc(r.invoice_number||'—')+'</td><td>'+esc(r.company_name||'—')+'</td><td>'+esc(r.issue_date||'—')+'</td><td>'+esc(r.status||'—')+'</td><td>'+money(r.total)+'</td></tr>').join('')+'</tbody></table>':'No invoices saved yet.'}catch(e){recent.textContent='Could not load dashboard: '+(e.message||e)}}
async function enterApp(){document.getElementById('authroot').style.display='none';document.getElementById('approot').style.display='block';document.getElementById('userEmail').textContent=currentUser?.email||'';document.getElementById('dashUser').textContent=currentUser?.email||'';showInvoice()}
sb.auth.getSession().then(async r=>{if(r.data.session){currentUser=r.data.session.user;await enterApp()}});
document.getElementById('downloadPdfBtn').addEventListener('click',exportInvoicePDF);document.getElementById('signoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();currentUser=null;document.getElementById('approot').style.display='none';document.getElementById('authroot').style.display='grid'});
document.getElementById('dashboardBtn').addEventListener('click',showDashboard);document.getElementById('newInvoiceBtn').addEventListener('click',showInvoice);document.getElementById('refreshDashboardBtn').addEventListener('click',loadDashboard);
async function exportInvoicePDF(){const btn=document.getElementById('downloadPdfBtn'),original=btn.innerHTML;btn.disabled=true;btn.textContent='Preparing PDF…';try{if(!window.html2pdf)throw new Error('PDF engine did not load. Check your internet connection and reload.');renderPreview();const paper=document.getElementById('paper'),safe=(document.getElementById('invoiceNo').value||'invoice').replace(/[^a-z0-9-_]+/gi,'-');await window.html2pdf().set({margin:0,filename:safe+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}}).from(paper).save()}catch(e){alert('Could not download the PDF: '+(e.message||e))}finally{btn.disabled=false;btn.innerHTML=original}}
function makeUuid(){return crypto.randomUUID()}
async function saveInvoiceToDb(){if(!currentUser){alert('Please sign in first.');return}const company=document.getElementById('company').value,clName=document.getElementById('client').value.trim();if(!clName){alert('Enter a client name first.');return}const btn=document.getElementById('saveInvoiceBtn');btn.disabled=true;btn.textContent='Saving…';try{const cid=makeUuid(),iid=makeUuid();const client={id:cid,created_by:currentUser.id,name:clName,company_name:clName,email:'',phone:'',gstin:document.getElementById('clientGstin').value||'',billing_address:document.getElementById('address').value||''};const cr=await sb.from('kkp_invoice_clients').insert(client);if(cr.error)throw cr.error;let subtotal=0,tax=0;items.forEach(it=>{const amount=(Number(it.qty)||0)*(Number(it.rate)||0);subtotal+=amount;tax+=amount*(Number(it.gst)||0)/100});const type=document.getElementById('invoiceType').value;const inv={id:iid,created_by:currentUser.id,client_id:cid,invoice_number:document.getElementById('invoiceNo').value||('KKP/'+new Date().getFullYear()+'/001'),status:'draft',issue_date:document.getElementById('date').value||new Date().toISOString().slice(0,10),currency:'INR',gst_mode:'cgst_sgst',gst_rate:items.length?Number(items[0].gst)||0:0,subtotal,discount_amount:0,taxable_amount:subtotal,cgst_amount:tax/2,sgst_amount:tax/2,igst_amount:0,tax_amount:tax,total:subtotal+tax,notes:'Document type: '+type+'\n'+(document.getElementById('notes').value||''),terms:'Payment due as per agreed terms.',company_name:company,template_type:document.getElementById('logoSelect').value==='ACS'?'acs':'kkp'};const ir=await sb.from('kkp_invoices').insert(inv);if(ir.error)throw ir.error;const rows=items.map((it,n)=>({invoice_id:iid,created_by:currentUser.id,description:it.desc||'Item',quantity:Number(it.qty)||1,unit_price:Number(it.rate)||0,gst_rate:Number(it.gst)||0,amount:(Number(it.qty)||0)*(Number(it.rate)||0),sort_order:n}));if(rows.length){const xr=await sb.from('kkp_invoice_items').insert(rows);if(xr.error)throw xr.error}btn.textContent='Saved to Supabase';setTimeout(()=>{btn.textContent='Save invoice';btn.disabled=false},2200)}catch(e){alert('Could not save invoice: '+(e.message||e));btn.textContent='Save invoice';btn.disabled=false}}
document.getElementById('saveInvoiceBtn').addEventListener('click',saveInvoiceToDb);

</script></body></html>
